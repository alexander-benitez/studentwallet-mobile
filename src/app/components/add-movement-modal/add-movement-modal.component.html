<div class="modal-wrapper">
  <!-- Selector Tipo: Ingreso / Gasto -->
  <div class="type-switch">
    <button 
      type="button" 
      class="switch-btn" 
      [class.active]="type === 'ingreso'" 
      (click)="setType('ingreso')">
      Ingreso
    </button>
    <button 
      type="button" 
      class="switch-btn" 
      [class.active]="type === 'gasto'" 
      (click)="setType('gasto')">
      Gasto
    </button>
  </div>

  <!-- Monto Centrado Gigante -->
  <div class="amount-container">
    <input 
      type="number" 
      [(ngModel)]="amount" 
      class="amount-input" 
      placeholder="0"
      min="0"
    />
  </div>

  <!-- Categorías (Chips) -->
  <div class="section-group">
    <label class="section-label">Categoría</label>
    <div class="chips-container">
      @for (cat of currentCategories; track cat.id) {
        <button
          type="button"
          class="chip-item"
          [class.selected]="selectedCategoryId === cat.id"
          (click)="selectCategory(cat.id)">
          <span class="chip-emoji">
            <ion-icon
              [name]="cat.icon"
              [style.color]="selectedCategoryId === cat.id ? '#ffffff' : cat.color"
            ></ion-icon>
          </span>
          <span>{{ cat.name }}</span>
        </button>
      }
    </div>

    @if (!isLoadingCategories && categories.length === 0) {
      <button type="button" class="btn-manage-categories" (click)="manageCategories()">
        <ion-icon name="settings-outline"></ion-icon>
        Administrar mis categorías
      </button>
    }
  </div>

  <!-- Fecha -->
  <div class="section-group">
    <label class="section-label">Fecha</label>
    <div class="input-card">
      <input type="date" [(ngModel)]="date" class="date-input" />
    </div>
  </div>

  <!-- Concepto -->
  <div class="section-group">
    <label class="section-label">Concepto</label>
    <div class="input-card">
      <input
        type="text"
        [(ngModel)]="concepto"
        placeholder="Ej. Pago de mensualidad"
        class="text-input"
      />
    </div>
  </div>

  <!-- Descripción -->
  <div class="section-group">
    <label class="section-label">Descripción</label>
    <div class="input-card">
      <input 
        type="text" 
        [(ngModel)]="description" 
        placeholder="Opcional" 
        class="text-input" 
      />
    </div>
  </div>

  <!-- Botón Guardar -->
  <button 
    type="button" 
    class="btn-save" 
    [class.btn-income]="type === 'ingreso'" 
    (click)="save()">
    {{ type === 'gasto' ? 'Guardar gasto' : 'Guardar ingreso' }}
  </button>

  <!-- Botón Cancelar -->
  <button type="button" class="btn-cancel" (click)="cancel()">
    Cancelar
  </button>
</div>
