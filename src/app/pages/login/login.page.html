<ion-header class="ion-no-border auth-header-bar">
  <ion-toolbar class="auth-toolbar">
    <ion-button fill="clear" class="back-link" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
      <span>Volver</span>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-page">
  <div class="login-container">
    <!-- Título y subtítulo -->
    <div class="auth-header">
      <h2>Inicia sesión</h2>
      <p>Qué bueno verte de nuevo. Usa tu correo @gmail.com (no se admiten otros dominios).</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onLogin()">
      <!-- Campo Correo -->
      <div class="form-group">
        <label>Correo electrónico</label>
        <div class="input-container">
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="usuario@gmail.com" 
            required 
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="Mínimo 6 caracteres" 
            required 
          />
          <button 
            type="button" 
            class="eye-btn" 
            (click)="togglePasswordVisibility()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <div class="forgot-wrapper">
          <a class="forgot-link" (click)="openForgotPassword()">¿Olvidaste tu contraseña?</a>
        </div>
      </div>

      <!-- Botón Iniciar Sesión -->
      <ion-button
        expand="block"
        type="submit"
        class="btn-submit"
        [disabled]="isLoading">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>Iniciar sesión</span>
        }
      </ion-button>

        @if (errorMessage) {
          <div class="sw-inline-feedback" role="alert">
            <div class="feedback-row">
              <ion-icon name="alert-circle-outline"></ion-icon>
              <span>{{ errorMessage }}</span>
            </div>
          </div>
        }
    </form>

    <!-- Enlace inferior -->
    <div class="footer-link">
      <span>¿No tienes cuenta? </span>
      <ion-button fill="clear" class="footer-inline-btn" (click)="goToRegister()">Crear una cuenta</ion-button>
    </div>
  </div>
</ion-content>
