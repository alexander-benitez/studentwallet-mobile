<ion-header class="ion-no-border auth-header-bar">
  <ion-toolbar class="auth-toolbar">
    <a routerLink="/login" class="back-link">
      <ion-icon name="chevron-back-outline"></ion-icon>
      <span>Volver</span>
    </a>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-page">
  <div class="reset-container">
    <div class="auth-header">
      <h2>Restablecer contraseña</h2>
      <p>Ingresa el código recibido y tu nueva contraseña.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Correo electrónico</label>
        <div class="input-container">
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="tu@correo.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label>Código de 6 dígitos</label>
        <div class="input-container">
          <input
            type="text"
            [(ngModel)]="code"
            name="code"
            placeholder="123456"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label>Nueva contraseña</label>
        <div class="input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="new-password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <div class="input-container">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="passwordConfirmation"
            name="confirm-new-password"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
            required
          />
          <button type="button" class="eye-btn" (click)="toggleConfirmPassword()">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <ion-button expand="block" type="submit" class="btn-submit" [disabled]="isLoading">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          <span>Restablecer contraseña</span>
        }
      </ion-button>
    </form>
  </div>
</ion-content>
