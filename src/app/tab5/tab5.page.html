<ion-header class="profile-header">
  <ion-toolbar>
    <ion-title>Mi perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-content">
  <div class="profile-wrapper">
    <div class="profile-card">
      <div class="avatar">{{ iniciales }}</div>
      <h2 class="profile-name">{{ nombreCompleto }}</h2>
      <span class="profile-role">{{ rol }}</span>
    </div>

    <ion-list class="profile-list" lines="none">
      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="stacked"
          [(ngModel)]="profile.name"
          placeholder="Tu nombre">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Apellido"
          labelPlacement="stacked"
          [(ngModel)]="profile.apellido"
          placeholder="Tu apellido">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Universidad o institución"
          labelPlacement="stacked"
          [(ngModel)]="profile.universidad"
          placeholder="Ej. ITCA-FEPADE">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Carrera"
          labelPlacement="stacked"
          [(ngModel)]="profile.carrera"
          placeholder="Ej. Desarrollo de Software">
        </ion-input>
      </ion-item>
    </ion-list>

    <ion-button
      expand="block"
      class="save-button"
      (click)="saveProfile()"
      [disabled]="saving">
      <ion-icon name="save-outline" slot="start"></ion-icon>
      {{ saving ? 'Guardando...' : 'Guardar cambios' }}
    </ion-button>

    <div class="password-card">
      <h3>Cambiar contraseña</h3>
      <p>El correo de inicio de sesión no se puede cambiar desde aquí.</p>
      <ion-list class="profile-list" lines="none">
        <ion-item>
          <ion-input
            label="Nueva contraseña"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="newPassword"
            placeholder="Mínimo 6 caracteres">
          </ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Confirmar contraseña"
            labelPlacement="stacked"
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="Repite la contraseña">
          </ion-input>
        </ion-item>
      </ion-list>
      <ion-button
        expand="block"
        class="password-button"
        (click)="changePassword()"
        [disabled]="changingPassword">
        {{ changingPassword ? 'Actualizando...' : 'Actualizar contraseña' }}
      </ion-button>
    </div>

    <ion-button expand="block" class="logout-button" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</ion-content>
